<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: black;
            font-size: 18px;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 25px;
            margin: 30px auto;
            width: 70%;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Webpage</h1>

        <p>
            Hello! My name is Pritee.
            I am learning HTML and CSS.
        </p>

        <center>
            <button>Learn More</button>
        </center>
    </div>

</body>
</html>
