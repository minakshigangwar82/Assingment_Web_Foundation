<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        body {
            background: lightblue;
            font-family: Arial;
            text-align: center;
        }
        .card {
            background: white;
            width: 280px;
            margin: 60px auto;
            padding: 25px;
            border: 2px solid lightgray;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }
        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        h2 { color: darkblue; }
        button {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOzYuIkcCk4bx7xz97nDe-aiiQabU5zpAtfWYxvKMxeF_HnSKfe7TSKfE&s=10" alt="profile-emage" alt="Profile photo">
        <h2>Minakshi</h2>
        <p>BCA (AI) Student</p>
        <p>Learning HTML, CSS and Java.</p>
        <button>Contact Me</button>
    </div>
</body>
</html>
