<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: lightgray;
        }

        h1 {
            background: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            display: flex;
            background-color: aqua;
        }

        .menu {
            background: black;
            color: white;
            padding: 20px;
            width: 150px;
        }

        .content {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>My Dashboard</h1>

    <div class="container">

        <div class="menu">
            <h3>Menu</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
        </div>

        <div class="content">
            <h2>Dashboard Overview</h2>

            <div class="card">
                <h3>Students</h3>
                <p>120 Students</p>
            </div>

            <div class="card">
                <h3>Courses</h3>
                <p>8 Courses</p>
            </div>

            <div class="card">
                <h3>Projects</h3>
                <p>15 Projects</p>
            </div>
        </div>

    </div>

</body>
</html>
