<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Specification Table</title>
</head>
<body>

    <h1>Electronic Products</h1>

    <table border="1" cellpadding="10">
        <caption>Product Specifications</caption>

        <thead>
            <tr>
                <th>Product Name</th>
                <th>Brand</th>
                <th>Specifications</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Laptop</td>
                <td>ASUS</td>
                <td>16 GB RAM, 512 GB SSD</td>
                <td>₹60,000</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Smartphone</td>
                <td>Samsung</td>
                <td>8 GB RAM, 128 GB Storage</td>
                <td>₹25,000</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Headphones</td>
                <td>Sony</td>
                <td>Wireless, Bluetooth</td>
                <td>₹3,000</td>
                <td>Out of Stock</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
