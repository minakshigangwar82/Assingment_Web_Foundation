<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            color: navy;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/id/10/300/200" alt="Nature">
        <img src="https://picsum.photos/id/20/300/200" alt="Forest">
        <img src="https://picsum.photos/id/30/300/200" alt="Mountains">
        <img src="https://picsum.photos/id/40/300/200" alt="Animals">
        <img src="https://picsum.photos/id/50/300/200" alt="Flowers">
        
        <img src="https://BRAVORally_AdmitCard_files/nature.jpg">
    </div>

</body>
</html>
