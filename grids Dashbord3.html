<!DOCTYPE html>
<html>
<head>
    <title>Product Grid</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: navy;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        button {
            background: navy;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
