<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>
    
    <form>
        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Details</legend>
            
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"  placeholder=" " required><br><br>

            <label for="address">Current Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40" required></textarea>
        </fieldset>

        <br>

        <!-- Academic Information -->
        <fieldset>
            <legend>Course Preferences</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Choose a Course --</option>
                <option value="cs">Computer Science</option>
                <option value="it">Information Technology</option>
                <option value="ee">Electrical Engineering</option>
                <option value="me">Mechanical Engineering</option>
            </select>
        </fieldset>

        <br>

        <!-- Form Submission -->
        <input type="submit" value="Register Student">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
