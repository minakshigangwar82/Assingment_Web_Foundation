


*Task 6: Responsive Menu*
```
<!DOCTYPE html>
<html>
<head>
  <style>
    nav { background: #333; padding: 10px; display: flex; justify-content: space-between; align-items: center;}
    nav ul { list-style: none; display: flex; }
    nav a { color: white; text-decoration: none; margin: 0 15px; }
    .menu-icon { display: none; font-size: 24px; color: white; cursor: pointer; }
    @media (max-width: 768px) {
      nav ul { display: none; flex-direction: column;}
      .menu-icon {
        display: block;
      }
       #menu.show { display: flex; }

      
    
    }
  </style>
</head>
<body>
  <nav>
    <h1 style="color:white">MGGOI</h1>
    <ul id="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
</nav>
<script>
    function toggleMenu() {
      document.getElementById('menu').classList.toggle('show');
    }
  </script>
</body>
</html>
