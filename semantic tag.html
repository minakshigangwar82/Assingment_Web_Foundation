<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Webpage</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my webpage</p>
    </header>

    <nav>
        <a href="#home">Home</a> |
        <a href="#about">About</a> |
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>This is the home section.</p>
        </section>

        <article id="about">
            <h2>About Us</h2>
            <p>This website provides useful information.</p>
        </article>

        <aside>
            <h3>Notice</h3>
            <p>New updates are available.</p>
        </aside>
    </main>

    <footer id="contact">
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
